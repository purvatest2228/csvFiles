# Single source of truth for pull request descriptions.
#
# Edit this file, then run:
#     python3 .github/scripts/generate_pr_template.py
# to regenerate .github/pull_request_template.md.
#
# CI enforces both: the "PR body check" job validates descriptions against
# these rules, and the "Template in sync" job fails if the generated template
# was not regenerated after this file changed.
#
# TOML rule to respect when editing: every top-level key below must stay
# ABOVE the first [[sections]] block, or it silently becomes a key of the
# preceding section instead.

# A section counts as filled once it has this many real characters,
# after HTML comments and checklist lines are stripped out.
min_section_chars = 10

# Any "- [ ]" left in the description fails the check.
require_all_checkboxes_ticked = true

checklist = [
  "Column count is unchanged, or the change is described above",
  "No unescaped commas or line breaks inside fields",
  "File still parses (`python3 -c \"import csv; list(csv.reader(open('inditeProducts1.csv')))\"`)",
  "No credentials, personal data, or internal-only values committed",
  "PR title describes the change, not the file name",
  "Correct code owner is requested for review",
]

# Phrases that must never survive into a real description.
banned_phrases = [
  { pattern = '(?i)\bTODO\b', message = "Remove TODO from the description before requesting review" },
  { pattern = '(?im)^\s*(wip|n/?a|none|tbd)\s*$', message = 'Placeholder text like "WIP" or "TBD" is not a description' },
]

[[sections]]
title = "What changed"
hint = "One or two lines. What does this PR do?"
required = true

[[sections]]
title = "Why"
hint = "Reason for the change. Link the issue: Closes #123"
required = true
must_match = [
  { pattern = '(?i)\b(closes|fixes|resolves|refs)\s+#\d+', message = 'Link an issue, e.g. "Closes #12"' },
]

[[sections]]
title = "Data impact"
hint = "Delete this section if no CSV files changed."
# Only required when the PR touches a path matching one of these globs.
required_when_paths = ["*.csv"]
body = """
- Files touched:
- Rows added / removed / modified:
- Column schema changed? (yes / no — if yes, list columns)
- Backward compatible with existing parsers?
"""

[[sections]]
title = "How to verify"
hint = "Exact steps a reviewer can follow."
required = true
body = """
1.
2.
"""

[[sections]]
title = "Notes for reviewer"
hint = "Anything risky, anything you are unsure about, anything to look at first."
required = false
